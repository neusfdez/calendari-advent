<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendario de Adviento</title>
  <meta name="description" content="Una calle de Navidad con una ventana para cada día de diciembre.">
  <meta name="theme-color" content="#18214a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="noanim">
  <header id="top">
    <!-- BOTÓN DE PRUEBA: bórralo cuando ya no lo necesites -->
    <button id="testBtn" type="button" aria-pressed="false">🧪 Modo prueba: OFF</button>
    <h1>Calendario de Adviento</h1>
    <p id="subtitle">&nbsp;</p>
  </header>

  <main id="scene">
    <div id="street">
      <svg id="house" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Calle de Navidad con 24 ventanas"></svg>
    </div>
  </main>

  <div id="hint" aria-hidden="true">← desliza para pasear por la calle →</div>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>

  <section id="room" aria-hidden="true">
    <svg id="roomArt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <button id="back" type="button">← Volver a la calle</button>
    <article id="card">
      <p id="cardDate"></p>
      <h2 id="cardTitle"></h2>
      <div id="cardBody"></div>
    </article>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="days.js"></script>
  <script src="quiz.js"></script>
  <script src="bola.js"></script>
  <script src="app.js"></script>
</body>
</html>
